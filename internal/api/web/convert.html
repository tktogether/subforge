<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubForge · Convert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="/app.js"></script>
</head>
<body>
<header class="nav">
  <a class="brand" href="/">sub<span>forge</span></a>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/convert">Convert</a>
    <a href="/rules">Rules</a>
    <a href="/logs">Logs</a>
  </nav>
  <div class="spacer"></div>
  <input id="tokenInput" class="mono" placeholder="token (本地)" style="width:150px">
  <button id="themeToggle" class="theme-toggle">☀</button>
</header>
<main class="page">
  <div class="page-head">
    <h1>Convert</h1>
    <p>输入 → 管线 → 输出 · 深度编辑在下方展开</p>
  </div>

  <div class="grid two">
    <div>
      <section class="panel">
        <h2>输入</h2>
        <div class="field">
          <label>订阅 URL <span class="hint">每行一条，或分号分隔</span></label>
          <textarea id="cvUrls" rows="4" placeholder="https://a.example/sub&#10;https://b.example/sub"></textarea>
        </div>
        <div class="field">
          <label>粘贴文本 <span class="hint">订阅内容，可与 URL 同时使用</span></label>
          <textarea id="cvText" rows="4" placeholder="粘贴订阅内容（YAML/JSON/分享链接等）"></textarea>
        </div>
        <div class="field">
          <label>本地文件 <span class="hint">选择订阅文件，自动读取为文本</span></label>
          <input type="file" id="cvFile">
        </div>
        <div class="field-row">
          <div class="field">
            <label>输出格式</label>
            <select id="cvTarget"></select>
          </div>
          <div class="field">
            <label>命名管线 <span class="hint">模板 [pipeline]</span></label>
            <select id="cvPipeline"></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>模板 config</label>
            <input type="text" id="cvConfig" placeholder="INI 路径或 URL（可选）">
          </div>
          <div class="field">
            <label>包含类型 <span class="hint">逗号分隔</span></label>
            <input type="text" id="cvTypes" placeholder="vless,trojan">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>include <span class="hint">节点名正则，分号分隔</span></label>
            <input type="text" id="cvInclude" placeholder="^(HK|JP)">
          </div>
          <div class="field">
            <label>exclude <span class="hint">正则，分号分隔</span></label>
            <input type="text" id="cvExclude" placeholder="流量|到期">
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn primary" id="cvRun">转换</button>
          <button class="btn" id="cvDownload">下载</button>
          <button class="btn ghost" id="cvCopy">复制</button>
        </div>
        <div id="cvState" class="state" style="display:none;margin-top:12px"></div>
      </section>

      <details class="panel" style="margin-top:16px">
        <summary>高级 <span class="hint muted" style="font-weight:400">覆盖 DSL / 过滤 / 排序</span></summary>
        <div class="body">
          <div class="field-row">
            <div class="field">
              <label>排序</label>
              <select id="cvSort">
                <option value="">（默认）</option>
                <option value="name">name</option>
                <option value="type">type</option>
                <option value="latency">latency</option>
                <option value="original">original</option>
              </select>
            </div>
            <div class="field">
              <label>仅输出分享链接</label>
              <select id="cvList"><option value="">否</option><option value="1">是</option></select>
            </div>
          </div>
          <div class="field">
            <label>覆盖 DSL <span class="hint">YAML，按 M2 分层覆盖语法</span></label>
            <textarea id="cvOverride" rows="6" placeholder="groups:
  - name: 手动选择
    type: select
rules:
  prepend:
    - MATCH,手动选择
proxy:
  - name: .*HK.*
    server: hk.example.com"></textarea>
          </div>
          <div class="field">
            <label>基线（用于 diff） <span class="hint">粘贴上一版配置</span></label>
            <textarea id="cvBaseline" rows="4" placeholder="可选：粘贴旧配置以查看 diff"></textarea>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn" id="cvDiff">生成 diff</button>
          </div>
        </div>
      </details>

      <details class="panel" style="margin-top:16px" id="diffPanel">
        <summary>diff 预览</summary>
        <div class="body">
          <div class="diff" id="cvDiffOut"><div class="ln"><span class="sign"></span><span class="muted">尚无 diff</span></div></div>
        </div>
      </details>
    </div>

    <aside>
      <section class="panel">
        <h2>输出</h2>
        <div class="field-row">
          <div class="field"><label>格式</label><div class="mono" id="cvFormat">—</div></div>
          <div class="field"><label>节点</label><div class="mono" id="cvNodes">—</div></div>
        </div>
        <div id="cvMeta" class="muted" style="font-size:13px;margin-bottom:8px"></div>
        <textarea id="cvOut" rows="20" placeholder="转换结果"></textarea>
      </section>
    </aside>
  </div>
</main>
<script src="/js/convert.js"></script>
</body>
</html>
