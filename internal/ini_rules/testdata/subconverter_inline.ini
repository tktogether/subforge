# SubForge 规则源夹具：subconverter 内联规则集写法
#
# 结构取自 Aethersailor Custom_OpenClash_Rules 的 cfg/Custom_Clash_Full.ini
# （167 行、56 条 ruleset=，其中 50 条是 [] 内联形态、6 条是 clash-domain/clash-classic
# 远程形态）。这里缩到 6 条，保留四种形态与真实文件的相对顺序：
# 内联在上、远程在中、[]FINAL 收尾。组名保留 emoji 与空格，与真实文件一致。
[custom]
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🛑 广告拦截,clash-domain:https://example.com/rule/Custom_Direct_Domain.mrs,1800
ruleset=🍃 应用净化,clash-classic:https://example.com/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=📲 电报消息,[]GEOIP,telegram,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL
