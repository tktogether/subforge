name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  cross:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross builds (delivery matrix)
        run: |
          set -e
          # 九个交付目标。CGO_ENABLED=0 已由 job 级 env 设定。
          # mipsle/mips 用 softfloat：硬浮点变体在多数家用路由固件上跑不起来。
          for target in \
            linux/amd64 linux/arm64 linux/arm \
            windows/amd64 darwin/amd64 darwin/arm64 \
            freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/subforge
            echo "ok: $target"
          done
          for target in linux/mipsle linux/mips; do
            GOOS=${target%/*} GOARCH=${target#*/} GOMIPS=softfloat go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/subforge
            echo "ok: $target (softfloat)"
          done
