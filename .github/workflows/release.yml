name: Package / Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional branch/commit to package (default: current HEAD)'
        required: false
        default: ''

permissions:
  contents: write      # 创建 Release
  packages: write      # 推 ghcr.io 镜像

env:
  CGO_ENABLED: "0"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web gates
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run typecheck
          pnpm --dir web run test
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go gates
        run: |
          go vet ./...
          go test ./... -count=1

  package:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ---- web dist（go:embed 依赖）----
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web dist
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      # ---- 交叉编译全矩阵（与 make cross 一致，版本号用 tag）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # ---- 版本元数据（交叉编译与镜像构建共用同一套取值）----
      - name: Compute build metadata
        id: meta
        shell: bash
        run: |
          echo "version=${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Cross compile release binaries
        run: |
          VER=${{ steps.meta.outputs.version }}
          SHORT=${{ steps.meta.outputs.short }}
          DATE=${{ steps.meta.outputs.date }}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -mod=vendor \
              -ldflags "-s -w -X github.com/tktogether/subforge/internal/buildinfo.Version=$VER -X github.com/tktogether/subforge/internal/buildinfo.Commit=$SHORT -X github.com/tktogether/subforge/internal/buildinfo.Date=$DATE" \
              -o "dist/subforge-${target/\//-}" ./cmd/subforge
            echo "ok: $target"
          done
          # Windows 后缀
          mv dist/subforge-windows-amd64 dist/subforge-windows-amd64.exe
      - name: ELF magic spot-check (linux/amd64)
        run: |
          magic=$(head -c 4 dist/subforge-linux-amd64 | od -An -tx1 | tr -d ' \n')
          [ "$magic" = "7f454c46" ] || { echo "bad magic: $magic"; exit 1; }
      - name: Smoke test (linux/amd64 version)
        run: ./dist/subforge-linux-amd64 version
      - name: Checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      # ---- Docker 镜像（推 GHCR，linux/amd64 + linux/arm64）----
      # 默认标签指向 Dockerfile.alpine：scratch 运行层不含任何根证书，抓 HTTPS 订阅源会直接
      # 失败，不适合作为对外默认产物；需要最小体积的用户用 -scratch 后缀的标签。
      # 两个镜像都显式传 build-args，使镜像自报版本与 Release 资产一致。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push default image (alpine runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Build & push minimal image (scratch runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-scratch
            ghcr.io/${{ github.repository }}:latest-scratch

      # ---- GitHub Release（仅 tag 触发）----
      - name: Upload release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
      - name: Upload artifacts (手动触发时以 artifact 交付)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: subforge-packages
          path: dist/*
          if-no-files-found: error