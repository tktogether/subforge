name: Package / Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional branch/commit to package (default: current HEAD)'
        required: false
        default: ''

permissions:
  contents: write      # 创建 Release
  packages: write      # 推 ghcr.io 镜像

env:
  CGO_ENABLED: "0"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web gates
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run typecheck
          pnpm --dir web run test
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go gates
        run: |
          go vet ./...
          go test ./... -count=1

  package:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ---- web dist（go:embed 依赖）----
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web dist
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      # ---- 交叉编译全矩阵（与 make cross 一致，版本号用 tag）----
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross compile release binaries
        run: |
          VER=${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}
          SHORT=\$(git rev-parse --short=8 HEAD)
          DATE=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=\${target%/*} GOARCH=\${target#*/} go build -trimpath -mod=vendor \
              -ldflags "-s -w -X github.com/tktogether/subforge/internal/buildinfo.Version=\$VER -X github.com/tktogether/subforge/internal/buildinfo.Commit=\$SHORT -X github.com/tktogether/subforge/internal/buildinfo.Date=\$DATE" \
              -o "dist/subforge-\${target/\//-}" ./cmd/subforge
            echo "ok: \$target"
          done
          for target in linux/mipsle linux/mips; do
            GOOS=\${target%/*} GOARCH=\${target#*/} GOMIPS=softfloat go build -trimpath -mod=vendor \
              -ldflags "-s -w -X github.com/tktogether/subforge/internal/buildinfo.Version=\$VER -X github.com/tktogether/subforge/internal/buildinfo.Commit=\$SHORT -X github.com/tktogether/subforge/internal/buildinfo.Date=\$DATE" \
              -o "dist/subforge-\${target/\//-}-softfloat" ./cmd/subforge
            echo "ok: \$target (softfloat)"
          done
          # Windows 后缀
          mv dist/subforge-windows-amd64 dist/subforge-windows-amd64.exe
      - name: ELF magic spot-check (linux/amd64)
        run: |
          magic=\$(head -c 4 dist/subforge-linux-amd64 | od -An -tx1 | tr -d ' \n')
          [ "\$magic" = "7f454c46" ] || { echo "bad magic: \$magic"; exit 1; }
      - name: Smoke test (linux/amd64 version)
        run: ./dist/subforge-linux-amd64 version
      - name: Checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      # ---- Docker 镜像（scratch + alpine，推 GHCR）----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      # ---- GitHub Release（仅 tag 触发）----
      - name: Upload release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
      - name: Upload artifacts (手动触发时以 artifact 交付)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: subforge-packages
          path: dist/*
          if-no-files-found: error