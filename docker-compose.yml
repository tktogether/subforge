# SubForge Docker Compose
#
# 开箱即用：镜像已把 SUBFORGE_LISTEN 设为 0.0.0.0:25500、SUBFORGE_DATA_DIR 设为 /data，
# 因此 `docker compose up -d` 之后直接访问 http://127.0.0.1:25500 就能看到控制台，
# 订阅管理（SQLite）默认启用。数据落在宿主机目录 ./data，迁移/备份直接复制该目录即可。
services:
  subforge:
    build:
      context: .
      # 默认用 alpine 运行层而不是 scratch：scratch 镜像内没有任何根证书，抓 HTTPS 订阅源会直接
      # 失败（tls: failed to verify certificate: x509: certificate signed by unknown authority）。
      # 只有在确定上游全部是 http:// 或本地文件、且追求最小体积时，才改成 Dockerfile。
      dockerfile: Dockerfile.alpine
      # 版本信息默认留空（与 Dockerfile 的默认值一致）。想让它出现在 `subforge version` 与产物
      # 头部注释里，就设置下面三个环境变量后重新构建，例如：
      #   $env:SUBFORGE_VERSION="v0.1.1"; $env:SUBFORGE_COMMIT=(git rev-parse --short HEAD); docker compose build
      args:
        VERSION: ${SUBFORGE_VERSION:-dev}
        COMMIT: ${SUBFORGE_COMMIT:-none}
        DATE: ${SUBFORGE_DATE:-unknown}
    image: subforge:latest
    container_name: subforge
    ports:
      - "25500:25500"
    volumes:
      # 宿主机目录挂到数据目录：subforge.db、规则源缓存都在这里。
      # 用目录而不是具名卷/单文件，备份和迁移时直接复制 ./data 即可。
      - ./data:/data
      # 需要自定义 INI 模板时再取消注释，并把 SUBFORGE_CONFIG 指到文件：
      # - ./config:/config:ro
    environment:
      # 订阅管理数据目录。serve 只认 SUBFORGE_DATA_DIR 这个名字。
      - SUBFORGE_DATA_DIR=/data
      # 容器内必须监听所有网卡：只绑 127.0.0.1 时，端口映射到宿主机后连接会被重置。
      # 镜像默认已是该值，这里显式写出便于修改。
      - SUBFORGE_LISTEN=0.0.0.0:25500
      # 下面两项按需取消注释。注意 SUBFORGE_CONFIG 指向的是**文件**而不是目录，
      # 且文件必须已存在，否则 serve 会以「读取配置 ... no such file or directory」退出。
      # 设置 SUBFORGE_TOKEN 后，控制台首次打开会弹出令牌输入框，填入同一个值即可。
      # - SUBFORGE_TOKEN=<YOUR_TOKEN>
      # - SUBFORGE_CONFIG=/config/subforge.ini
    restart: unless-stopped
